name: Update README cards

# Regenerates profile/stats.svg and profile/top-langs.svg with the
# stats-organization/github-readme-stats-action (same renderers as
# github-readme-stats). Uses the default GITHUB_TOKEN; contents: write
# lets that token commit the SVGs back to this repo.
#
# After merging, run this once from the Actions tab:
# Update README cards → Run workflow.
# It also runs daily at midnight UTC, and when this file changes on main.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=AlexWoods1&show_icons=true&hide_border=true&include_all_commits=true&bg_color=182B49&title_color=FFCD00&icon_color=FFCD00&text_color=ffffff&ring_color=FFCD00
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
          core_version: "2.3.0"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=AlexWoods1&layout=compact&hide_border=true&langs_count=8&bg_color=182B49&title_color=FFCD00&icon_color=FFCD00&text_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
          core_version: "2.3.0"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
